const d='M'+L.map(p=>p.join(' ')).join('L')+'L'+R.reverse().map(p=>p.join(' ')).join('L')+'Z';
let o=`<path d="${d}" transform="translate(.4,.6)" fill="#0003"/><path d="${d}" fill="${col}" stroke="#0005" stroke-width=".25" stroke-linejoin="round"/>`;
for(let i=3;i<n-2;i+=3)o+=`<circle cx="${P[i][0]}" cy="${P[i][1]}" r="${wd(i)*.45}" fill="#fff" opacity=".45"/>`;
const hx0=P[0][0]-P[2][0],hy0=P[0][1]-P[2][1],hl=Math.hypot(hx0,hy0),hx=hx0/hl,hy=hy0/hl,cx=P[0][0]+hx*.6,cy=P[0][1]+hy*.6,ang=Math.atan2(hy,hx)*180/Math.PI,qx=-hy,qy=hx;
o+=`<path d="M${cx+hx*2.2} ${cy+hy*2.2}L${cx+hx*3.5} ${cy+hy*3.5}L${cx+hx*4.2+qx*.6} ${cy+hy*4.2+qy*.6}M${cx+hx*3.5} ${cy+hy*3.5}L${cx+hx*4.2-qx*.6} ${cy+hy*4.2-qy*.6}" stroke="#e11d48" stroke-width=".3" fill="none" stroke-linecap="round"/><ellipse cx="${cx}" cy="${cy}" rx="2.4" ry="1.9" transform="rotate(${ang} ${cx} ${cy})" fill="${col}" stroke="#0005" stroke-width=".25"/>`;
for(const sg of[1,-1]){const ex=cx+hx*.7+qx*sg,ey=cy+hy*.7+qy*sg;o+=`<circle cx="${ex}" cy="${ey}" r=".6" fill="#fff"/><circle cx="${ex+hx*.15}" cy="${ey+hy*.15}" r=".3" fill="#111"/>`}
return o}
const SC=['#e63946','#8e44ad','#16a085','#e67e22','#2980b9'];let si=0;for(const[a,b]of Object.entries(SNAKES)){const col=SC[si++%SC.length];const[x1,y1]=xy(+a),[x2,y2]=xy(b);s+=snakeSVG(x1,y1,x2,y2,col);}
svg.innerHTML=s;
const isCpu=i=>i>0&&cpu.checked;
const lab=i=>`<span class="dot" style="background:${COLORS[i]}"></span>${NAMES[i]}${isCpu(i)?' (CPU)':''}`;
function place(i){let x,y;if(pos[i]===0){x=3+i*3;y=96}else{const[cx,cy]=xy(pos[i]);const same=pos.map((p,j)=>p===pos[i]?j:-1).filter(j=>j>=0);const o=same.length>1?OFF[i]:[0,0];x=cx+o[0];y=cy+o[1]}
toks[i].style.left=x+'%';toks[i].style.top=y+'%'}
const anim=async(i,cls,ms)=>{toks[i].classList.remove(cls);void toks[i].offsetWidth;toks[i].classList.add(cls);await sleep(ms);toks[i].classList.remove(cls)};
function chips(){$('chips').innerHTML=pos.map((p,i)=>`<span class="chip ${i===turn&&!over?'on':''}" style="background:${COLORS[i]}33"><span class="dot" style="background:${COLORS[i]}"></span>${NAMES[i]}${isCpu(i)?' 🤖':''} · ${p||'Start'}</span>`).join('');toks.forEach((t,i)=>t.classList.toggle('turn',i===turn&&!over))}
async function cooldown(ms,g){rollBtn.textContent='Wait…';cd.style.transition='none';cd.style.width='0';void cd.offsetWidth;cd.style.transition=`width ${ms}ms linear`;cd.style.width='100%';await sleep(ms);if(g!==gen)return;cd.style.transition='none';cd.style.width='0';rollBtn.textContent='Roll'}
function reset(){gen++;if(closeWord)closeWord();pos=Array(N).fill(0);turn=0;busy=false;over=false;toks.forEach(t=>t.remove());
toks=pos.map((_,i)=>{const t=document.createElement('div');t.className='tok';t.style.background=COLORS[i];board.appendChild(t);return t});
pos.forEach((_,i)=>place(i));die.textContent='🎲';cd.style.width='0';rollBtn.textContent='Roll';
document.querySelectorAll('.seg').forEach(b=>b.classList.toggle('on',+b.dataset.n===N));next()}
function next(){chips();if(over)return;SFX.turn();msg.innerHTML=lab(turn)+'’s turn — roll the dice!';rollBtn.disabled=isCpu(turn);if(isCpu(turn)&&!busy){const g=gen;setTimeout(()=>g===gen&&roll(),1000)}}
async function roll(){if(busy||over)return;busy=true;const g=gen;rollBtn.disabled=true;const p=turn;
msg.innerHTML=lab(p)+' is rolling…';die.className='rolling';
let d=70;for(let i=0;i<16;i++){die.textContent=FACES[Math.floor(Math.random()*6)];SFX.tick();await sleep(d);d+=i>9?35:12;if(g!==gen)return}
const v=1+Math.floor(Math.random()*6);die.className='land';SFX.land();die.textContent=FACES[v-1];
let note=`${lab(p)} rolled a <b>${v}</b>. `;msg.innerHTML=note;await sleep(800);if(g!==gen)return;
if(pos[p]+v<=100){for(let i=0;i<v;i++){pos[p]++;place(p);chips();SFX.hop(i);await anim(p,'hop',420);if(g!==gen)return}
 const f=pos[p];cells[f].classList.add('flash');setTimeout(()=>cells[f].classList.remove('flash'),1000);await showWord(f,isCpu(p));if(g!==gen)return;
 const tgt=SNAKES[f]||LADDERS[f];
 if(tgt){const sn=!!SNAKES[f];note+=sn?`🐍 Bitten! Down to ${tgt}.`:`🪜 Ladder! Up to ${tgt}.`;msg.innerHTML=note;await sleep(700);if(g!==gen)return;
  sn?SFX.snake():SFX.ladder();toks[p].style.transitionDuration='1.1s';pos[p]=tgt;place(p);chips();await anim(p,sn?'bite':'climb',1150);toks[p].style.transitionDuration='';cells[tgt].classList.add('flash');setTimeout(()=>cells[tgt].classList.remove('flash'),1000)}
}else{note+='Exact roll needed to reach 100.';msg.innerHTML=note}
if(g!==gen)return;
if(pos[p]===100){over=true;busy=false;msg.innerHTML=`🎉 ${lab(p)} wins!`;chips();rollBtn.disabled=true;SFX.win();confetti();return}
const again=v===6;if(again)msg.innerHTML=note+' <b>Six — roll again!</b>';else turn=(turn+1)%N;
await cooldown(1400,g);if(g!==gen)return;busy=false;next()}
function confetti(){for(let i=0;i<40;i++){const e=document.createElement('div');e.className='conf';e.textContent=['🎉','✨','🎊','⭐'][i%4];e.style.left=Math.random()*100+'vw';e.style.animationDuration=2.5+Math.random()*2.5+'s';e.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),6500)}}
rollBtn.onclick=roll;$('reset').onclick=reset;$('mute').onclick=e=>{muted=!muted;e.target.textContent=muted?'🔇 Sound off':'🔊 Sound on'};
document.querySelectorAll('.seg').forEach(b=>b.onclick=()=>{N=+b.dataset.n;reset()});
cpu.onchange=()=>{if(!busy){chips();next()}else chips()};
reset();
</script>
</body>
